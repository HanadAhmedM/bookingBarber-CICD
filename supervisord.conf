[supervisord]
nodaemon=true
user=root

[program:backend]
command=java -jar /app/backend.jar
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/sh -c "while ! nc -z 127.0.0.1 8080; do echo 'Waiting for backend...'; sleep 2; done; echo 'Backend ready - starting nginx'; nginx -g 'daemon off;'"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0