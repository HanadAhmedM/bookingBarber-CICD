name: CI

on:
  push:
    branches:
      - dev
      - main
      - "feature/**"

  pull_request:
    branches:
      - dev
      - main

jobs:

  # ==========================================
  # BACKEND BUILD + UNIT + INTEGRATION TESTS
  # ==========================================
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw clean verify


  # ==========================================
  # END-TO-END TESTS
  # ==========================================
  e2e:
    name: End-to-End tests
    runs-on: ubuntu-latest

    needs: backend

    # PostgreSQL used by the running Spring Boot
    # application during the E2E test.
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: barberdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d barberdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5


      # ------------------------------------------
      # Java
      # ------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # ------------------------------------------
      # Start backend
      # ------------------------------------------
      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/barberdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SERVER_PORT: 8080
          CORS_ORIGINS: http://localhost:5173

        run: |
          chmod +x mvnw

          nohup ./mvnw spring-boot:run > backend.log 2>&1 &

          echo $! > backend.pid


      # ------------------------------------------
      # Wait for backend
      # ------------------------------------------
      - name: Wait for backend
        run: |
          echo "Waiting for Spring Boot backend..."

          for i in {1..60}; do

            if nc -z localhost 8080; then
              echo "Backend is ready!"
              exit 0
            fi

            echo "Backend is not ready yet..."
            sleep 2

          done

          echo "Backend failed to start."

          echo "========== BACKEND LOG =========="
          cat backend/backend.log || true

          exit 1


      # ------------------------------------------
      # Node.js
      # ------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ------------------------------------------
      # Install frontend dependencies
      # ------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # ------------------------------------------
      # Install Playwright browsers
      # ------------------------------------------
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium


      # ------------------------------------------
      # Start frontend
      # ------------------------------------------
      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080

        run: |
          nohup npm run dev -- --host 0.0.0.0 > vite.log 2>&1 &

          echo $! > vite.pid


      # ------------------------------------------
      # Wait for frontend
      # ------------------------------------------
      - name: Wait for frontend
        run: |
          echo "Waiting for Vite frontend..."

          for i in {1..60}; do

            if curl -fsS http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi

            echo "Frontend is not ready yet..."
            sleep 2

          done

          echo "Frontend failed to start."

          echo "========== FRONTEND LOG =========="
          cat frontend/vite.log || true

          exit 1


      # ------------------------------------------
      # Run Playwright
      # ------------------------------------------
      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: true
          BASE_URL: http://localhost:5173
          VITE_API_URL: http://localhost:8080

        run: npm exec playwright test


      # ------------------------------------------
      # Upload Playwright report
      # ------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7