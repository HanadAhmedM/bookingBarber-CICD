name: E2E Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barberdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d barberdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/barberdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SERVER_PORT: 8080
          CORS_ORIGINS: http://localhost:5173
        run: |
          chmod +x mvnw

          nohup ./mvnw spring-boot:run > backend.log 2>&1 &

          echo $! > backend.pid

      - name: Wait for backend
        run: |
          echo "Waiting for Spring Boot backend..."

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi

            if nc -z localhost 8080; then
              echo "Backend port is open!"
              exit 0
            fi

            echo "Backend is not ready yet..."
            sleep 2
          done

          echo "Backend failed to start."
          echo "========== BACKEND LOG =========="
          cat backend/backend.log || true

          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080
        run: |
          nohup npm run dev -- --host 0.0.0.0 > vite.log 2>&1 &

          echo $! > vite.pid

      - name: Wait for frontend
        run: |
          echo "Waiting for Vite frontend..."

          for i in {1..60}; do
            if curl -fsS http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi

            echo "Frontend is not ready yet..."
            sleep 2
          done

          echo "Frontend failed to start."
          echo "========== FRONTEND LOG =========="
          cat frontend/vite.log || true

          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: true
          BASE_URL: http://localhost:5173
          VITE_API_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: frontend/vite.log
          if-no-files-found: ignore
          retention-days: 7