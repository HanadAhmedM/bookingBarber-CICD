cat > .github/workflows/deploy.yml << 'EOF'
name: Deploy to Render Production

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw clean verify

  test-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ✅ Körs alltid – både på PR och push – ger en tydlig grön bock i PR:en
  checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    steps:
      - name: Verify all tests succeeded
        run: |
          echo "backend:  ${{ needs.test-backend.result }}"
          echo "frontend: ${{ needs.test-frontend.result }}"
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "❌ Något test misslyckades"
            exit 1
          fi
          echo "✅ Alla tester OK"

  deploy-production:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Endast på push till dev – aldrig på PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Trigger Render deploy hook
        run: |
          echo "Triggering production deploy..."
          curl -fsS -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          echo "Deploy triggered ✅"
EOF
