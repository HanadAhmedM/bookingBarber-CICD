# Databas – värden kommer från miljövariabler på Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Loggning – lägre nivå i produktion
logging.level.root=WARN
logging.level.com.diamond=INFO

# CORS – tillåt frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}